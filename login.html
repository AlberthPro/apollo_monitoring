<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - webMethods IS</title>
    <link rel="stylesheet" href="css/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="icon" type="image/x-icon" href="https://cloudappi.net/wp-content/uploads/2026/03/tecnologias-cloudappi-_2_-768x432.webp">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Fondo animado con formas curvas SVG -->
    <div class="bg-shapes" aria-hidden="true">
        <!-- Curva superior izquierda -->
        <svg class="shape shape-1" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
            <path fill="#0284c7"
                d="M437.5,332.5Q405,415,322.5,451.5Q240,488,162,438.5Q84,389,77,294.5Q70,200,144,132.5Q218,65,313,82Q408,99,439,174.5Q470,250,437.5,332.5Z" />
        </svg>

        <!-- Curva inferior derecha -->
        <svg class="shape shape-2" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
            <path fill="#38bdf8"
                d="M466,341.5Q432,433,337,466Q242,499,161,439.5Q80,380,86,286Q92,192,165,131Q238,70,331.5,93.5Q425,117,462.5,183.5Q500,250,466,341.5Z" />
        </svg>

        <!-- Onda fluida inferior -->
        <svg class="wave-bottom" viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path fill="#0284c7" fill-opacity="0.22"
                d="M0,192L60,186.7C120,181,240,171,360,186.7C480,203,600,245,720,240C840,235,960,181,1080,165.3C1200,149,1320,171,1380,181.3L1440,192L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z">
            </path>
            <path fill="#38bdf8" fill-opacity="0.15"
                d="M0,256L80,240C160,224,320,192,480,197.3C640,203,800,245,960,250.7C1120,256,1280,224,1360,208L1440,192L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z">
            </path>
        </svg>
    </div>
    <div class="login-card">
        <div class="logo">
            <span class="logo-icon">
                <img src="https://cloudappi.net/wp-content/uploads/2026/03/tecnologias-cloudappi-_2_-768x432.webp"
                    alt="logo" />
            </span>
            <span class="env-badge" id="envBadge" data-env="QA">consola</span>
        </div>

        <div class="login-header">
            <h2>APOLLO MONITOR</h2>
            <p>Ingresa tus credenciales de acceso</p>
        </div>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Usuario IS" required autocomplete="username" />
            <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password" />
            <button type="submit" id="submitBtn">Ingresar</button>
            <p id="errorMsg"></p>
        </form>
    </div>
    <script>
        const baseHost = "http://10.209.23.55:5555";
        const basePath = "/rad/APOLLOMONITOR.auth.api:loginRest";
        const LOGIN_ENDPOINT = "/rest/auth/login"; // Ajusta a la ruta exacta de tu servicio REST en IS

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value;
            const errorMsg = document.getElementById("errorMsg");
            const submitBtn = document.getElementById("submitBtn");
            const basicToken = btoa(`${user}:${pass}`);

            errorMsg.textContent = "";
            submitBtn.disabled = true;
            submitBtn.textContent = "Validando...";

            try {
                const response = await fetch(baseHost+basePath+LOGIN_ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Authorization": `Basic ${basicToken}`,
                        "Accept": "application/json",
                        "X-Requested-With": "XMLHttpRequest"
                    },
                    credentials: "include" // Guarda la cookie ssnid que emite webMethods IS
                });

                if (response.ok) {
                    const data = await response.json();

                    if (data.SessionID) {
                        // Guardamos en memoria local (localStorage) el SessionID y el nombre de usuario
                        localStorage.setItem("wm_session_id", data.SessionID);
                        localStorage.setItem("wm_username", user);

                        window.location.href = "dashboard.html";
                    } else {
                        errorMsg.textContent = "El servidor no devolvió un SessionID válido.";
                    }
                } else {
                    errorMsg.textContent = "Usuario o contraseña incorrectos.";
                }
            } catch (err) {
                errorMsg.textContent = "Error de conexión con Integration Server.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Ingresar";
            }
        });
    </script>
</body>

</html>
